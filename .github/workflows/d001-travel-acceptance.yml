name: D-001 Travel Standard Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  store-acceptance:
    runs-on: ubuntu-latest
    env:
      STB_STORE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Store test suite (documented command)
        run: node --test *.test.mjs
